<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Гра «21»</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        .back-btn {
            position: fixed;
            top: 15px;
            left: 15px;
            background: #212529;
            color: #fff;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
        }
        .container {
            max-width: 600px;
            margin: 35px auto 0;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 { margin-top: 0; font-size: 1.5em; color: #333; }
        .scoreboard {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .player-info {
            width: 45%;
            min-width: 150px;
            margin-bottom: 15px;
        }
        .player-name {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .score {
            background: #00a2ff;
            color: white;
            padding: 10px;
            font-size: 1.8em;
            border-radius: 5px;
            font-weight: bold;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.2);
        }
        .controls { margin-bottom: 30px; }
        .attempt {
            font-style: italic;
            color: #555;
            margin-bottom: 10px;
            font-size: 1.1em;
        }
        .btn {
            background: #00ea00;
            color: black;
            border: none;
            padding: 15px 30px;
            font-size: 1.3em;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,234,0,0.3);
            transition: background 0.3s;
        }
        .btn:hover { background: #00c700; }
        .btn:disabled {
            background: #ccc;
            box-shadow: none;
            cursor: not-allowed;
        }
        .btn-restart {
            background: #ffaa00;
            box-shadow: 0 4px 6px rgba(255,170,0,0.3);
        }
        .btn-restart:hover { background: #e69900; }
        .cards-area {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
        }
        .card-slot {
            width: 45%;
            height: 220px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-width: 150px;
        }
        .card {
            width: 140px;
            height: 200px;
            border: 2px solid #ccc;
            border-radius: 12px;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            font-size: 2em;
            box-shadow: 3px 3px 10px rgba(0,0,0,0.15);
            position: relative;
        }
        .card.red { color: #d60000; }
        .card.black { color: #222; }
        .card-value { font-size: 1.8em; font-weight: bold; }
        .card-suit { font-size: 2em; margin-top: -10px; }
        .card-top-left {
            position: absolute;
            top: 5px;
            left: 10px;
            font-size: 0.4em;
            font-weight: bold;
            text-align: left;
            line-height: 1;
        }
        .card-bottom-right {
            position: absolute;
            bottom: 5px;
            right: 10px;
            font-size: 0.4em;
            font-weight: bold;
            text-align: right;
            line-height: 1;
            transform: rotate(180deg);
        }
        @media (max-width: 400px) {
            .card { width: 100px; height: 140px; }
            .card-value { font-size: 1.3em; }
            .card-suit { font-size: 1.5em; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">← На головну</a>

    <div class="container">
        <h1>Гра «21»</h1>
        <div class="scoreboard">
            <div class="player-info">
                <div class="player-name" id="userNameLabel">User</div>
                <div class="score" id="userScoreDisplay">0</div>
            </div>
            <div class="player-info">
                <div class="player-name">Computer</div>
                <div class="score" id="compScoreDisplay">0</div>
            </div>
        </div>

        <div class="controls">
            <div class="attempt" id="attemptLabel">Спроба 0 з 3</div>
            <button class="btn" id="generateBtn" onclick="generate()">Generate</button>
            <button class="btn btn-restart" id="restartBtn" onclick="resetGame(false)" style="display:none;">Почати знову</button>
        </div>

        <div class="cards-area">
            <div class="card-slot" id="userCardSlot"></div>
            <div class="card-slot" id="compCardSlot"></div>
        </div>
    </div>

    <script>
        let userName = "";
        let userScore = 0;
        let compScore = 0;
        let attempts = 0;
        const maxAttempts = 3;

        const suits = ['♠', '♣', '♥', '♦'];
        const values = [
            {name: '6', val: 6},
            {name: '7', val: 7},
            {name: '8', val: 8},
            {name: '9', val: 9},
            {name: '10', val: 10},
            {name: 'J', val: 2},
            {name: 'Q', val: 3},
            {name: 'K', val: 4},
            {name: 'A', val: 11}
        ];

        function getRandomCard() {
            const value = values[Math.floor(Math.random() * values.length)];
            const suit = suits[Math.floor(Math.random() * suits.length)];
            const color = (suit === '♥' || suit === '♦') ? 'red' : 'black';
            return { ...value, suit, color };
        }

        function initGame() {
            while (!userName || userName.trim() === "") {
                userName = prompt("Введіть ваше ім'я для початку гри:", "Гравець");
                if (userName === null) {
                    userName = "User";
                }
            }
            document.getElementById("userNameLabel").textContent = userName;
            resetGame(true);
        }

        function resetGame(isInitial = false) {
            if (!isInitial) {
                if (confirm("Змінити гравця?")) {
                    userName = "";
                    initGame();
                    return;
                }
            }
            userScore = 0;
            compScore = 0;
            attempts = 0;
            updateUI();
            document.getElementById("userCardSlot").innerHTML = "";
            document.getElementById("compCardSlot").innerHTML = "";
            document.getElementById("generateBtn").style.display = "inline-block";
            document.getElementById("restartBtn").style.display = "none";
        }

        function createCardHTML(card) {
            return `
                <div class="card ${card.color}">
                    <div class="card-top-left">${card.name}<br>${card.suit}</div>
                    <div class="card-value">${card.name}</div>
                    <div class="card-suit">${card.suit}</div>
                    <div class="card-bottom-right">${card.name}<br>${card.suit}</div>
                </div>
            `;
        }

        function generate() {
            if (attempts >= maxAttempts) return;
            attempts++;

            const userCard = getRandomCard();
            const compCard = getRandomCard();

            userScore += userCard.val;
            compScore += compCard.val;

            document.getElementById("userCardSlot").innerHTML = createCardHTML(userCard);
            document.getElementById("compCardSlot").innerHTML = createCardHTML(compCard);

            updateUI();

            if (attempts === maxAttempts) {
                setTimeout(declareWinner, 500);
            }
        }

        function updateUI() {
            document.getElementById("userScoreDisplay").textContent = userScore;
            document.getElementById("compScoreDisplay").textContent = compScore;
            document.getElementById("attemptLabel").textContent = `Спроба ${attempts} з ${maxAttempts}`;
        }

        function declareWinner() {
            let msg = "";
            if (userScore > compScore) {
                msg = `Вітаємо, ${userName}! Ви виграли з рахунком ${userScore} : ${compScore}`;
            } else if (compScore > userScore) {
                msg = `Ви програли! Комп'ютер виграв з рахунком ${compScore} : ${userScore}`;
            } else {
                msg = `Нічия! Рахунок ${userScore} : ${compScore}`;
            }
            alert(msg);
            document.getElementById("generateBtn").style.display = "none";
            document.getElementById("restartBtn").style.display = "inline-block";
        }

        window.onload = initGame;
    </script>
</body>
</html>
