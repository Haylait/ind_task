<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота №7 - Магічна куля</title>
</head>
<body>
    <script>
        const style = document.createElement('style');
        style.textContent = `
            body {
                margin: 0;
                padding: 0;
                background-color: #11111a;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            }
            .back-btn {
                position: fixed;
                top: 15px;
                left: 15px;
                background: rgba(255,255,255,0.15);
                color: #fff;
                text-decoration: none;
                padding: 8px 14px;
                border-radius: 8px;
                font-size: 14px;
            }
            .back-btn:hover { background: rgba(255,255,255,0.28); }
            .container {
                display: flex;
                flex-direction: column;
                align-items: center;
                width: 90%;
                max-width: 400px;
            }
            .question-input {
                width: 100%;
                padding: 15px 20px;
                border-radius: 30px;
                border: none;
                background-color: #ebdff7;
                color: #333;
                font-size: 18px;
                text-align: center;
                box-sizing: border-box;
                outline: none;
                box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            }
            .question-input::placeholder { color: #888; }
            .error-message {
                color: #ff6b6b;
                height: 20px;
                margin-top: 10px;
                margin-bottom: 20px;
                font-size: 14px;
            }
            .magic-ball {
                width: 300px;
                height: 300px;
                border-radius: 50%;
                background: radial-gradient(circle at 35% 35%, #ffffff 0%, #d4a5ff 15%, #6020a3 40%, #1a0b2e 80%, #000000 100%);
                box-shadow: 
                    inset -15px -15px 30px rgba(0,0,0,0.8), 
                    inset 10px 10px 20px rgba(255,255,255,0.4),
                    0 0 30px rgba(138, 87, 186, 0.4);
                display: flex;
                justify-content: center;
                align-items: center;
                cursor: pointer;
                position: relative;
                transition: transform 0.1s ease;
                user-select: none;
            }
            .magic-ball:active { transform: scale(0.95); }
            .answer-text {
                font-size: 42px;
                font-weight: bold;
                color: #ffffff;
                text-shadow: 0 0 10px #ffb3ff, 0 0 20px #cc00cc, 0 0 30px #800080;
                opacity: 0;
                transition: opacity 0.5s ease;
                text-align: center;
                padding: 20px;
            }
            .answer-text.visible { opacity: 1; }
            @media (max-width: 480px) {
                .magic-ball { width: 250px; height: 250px; }
                .answer-text { font-size: 32px; }
                .question-input { font-size: 16px; padding: 12px 15px; }
            }
        `;
        document.head.appendChild(style);

        const backLink = document.createElement('a');
        backLink.href = 'index.html';
        backLink.className = 'back-btn';
        backLink.textContent = '← На головну';
        document.body.appendChild(backLink);

        const container = document.createElement('div');
        container.className = 'container';
        const inputField = document.createElement('input');
        inputField.type = 'text';
        inputField.className = 'question-input';
        inputField.placeholder = 'Чи буде завтра сонячно?';
        const errorMessage = document.createElement('div');
        errorMessage.className = 'error-message';
        const ball = document.createElement('div');
        ball.className = 'magic-ball';
        ball.title = 'Натисни на мене!';
        const answerDisplay = document.createElement('div');
        answerDisplay.className = 'answer-text';
        ball.appendChild(answerDisplay);
        container.appendChild(inputField);
        container.appendChild(errorMessage);
        container.appendChild(ball);
        document.body.appendChild(container);

        const answers = [
            "Yes", "No", "Maybe", "Ask again later", 
            "Definitely", "I doubt it", "Of course", "Never"
        ];
        function askQuestion() {
            const question = inputField.value.trim();
            if (question.length === 0) {
                errorMessage.textContent = 'Будь ласка, введіть своє запитання!';
                answerDisplay.classList.remove('visible');
                return;
            }
            errorMessage.textContent = '';
            answerDisplay.classList.remove('visible');
            setTimeout(() => {
                const randomIndex = Math.floor(Math.random() * answers.length);
                answerDisplay.textContent = answers[randomIndex];
                answerDisplay.classList.add('visible');
            }, 300); 
        }
        ball.addEventListener('click', askQuestion);
        inputField.addEventListener('keypress', (event) => {
            if (event.key === 'Enter') askQuestion();
        });
    </script>
</body>
</html>
